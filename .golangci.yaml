version: "2"
run:
  tests: false
  timeout: 15m
linters:
  enable:
    - asciicheck
    - bodyclose
    - cyclop
  disable:
    - unused
  settings:
    cyclop:
      max-complexity: 20
      package-average: 0
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - cyclop
        path: (.+)_test\.go
    paths:
      - pkg/mod/.*
      - go/src/.*
      - third_party$
      - builtin$
      - examples$
